<h6>Tem certeza que deseja excluir a imagem: <strong>{{ object.image.url }}</strong></h6> 
<form method="post" action="{% url 'banner-delete' object.pk%}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-danger">Deletar</button>
</form>
